worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile          on;
    keepalive_timeout 65;

    # CV uploads / admin media uploads.
    client_max_body_size 50M;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;
    gzip_min_length 256;

    limit_req_zone $binary_remote_addr zone=api:10m rate=30r/s;

    # This server listens on plain HTTP behind the TLS-terminating OberigAI
    # nginx, so $scheme is always "http"; the real scheme arrives in
    # X-Forwarded-Proto. Empty value → nginx omits the HSTS header.
    map $http_x_forwarded_proto $site_hsts {
        https   "max-age=31536000; includeSubDomains";
        default "";
    }
    # Forward the original scheme downstream; fall back to $scheme when hit
    # directly (localhost:8083).
    map $http_x_forwarded_proto $fwd_proto {
        ""      $scheme;
        default $http_x_forwarded_proto;
    }

    upstream api {
        server api:8080;
    }
    upstream web {
        server web:3000;
    }

    proxy_http_version 1.1;
    proxy_set_header   Host              $host;
    proxy_set_header   X-Real-IP         $remote_addr;
    proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto $fwd_proto;
    proxy_read_timeout 60s;

    # ── Public site (Nuxt SSR) — default server ──────────────────────────────
    server {
        listen 80 default_server;
        server_name _;

        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security $site_hsts always;

        location /api/ {
            limit_req zone=api burst=60 nodelay;
            proxy_pass http://api;
        }

        location /health {
            proxy_pass http://api;
        }

        # Uploaded media: the api container's media volume, mounted read-only at
        # /usr/share/nginx/html/media → served as /media/<key>.
        location /media/ {
            root /usr/share/nginx/html;
            expires 30d;
            add_header Cache-Control "public" always;
        }

        # Everything else — Nuxt (pages, /_nuxt/ hashed assets, sitemap, robots).
        location / {
            proxy_pass http://web;
        }
    }

    # ── Admin (Flutter web static) ───────────────────────────────────────────
    server {
        listen 80;
        server_name admin.uagreen.co admin-new.uagreen.co;

        root  /usr/share/nginx/html/admin;
        index index.html;

        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Strict-Transport-Security $site_hsts always;

        # SPA fallback (hash routing, but keep deep links safe).
        location / {
            try_files $uri $uri/ /index.html;
        }

        location /api/ {
            limit_req zone=api burst=60 nodelay;
            proxy_pass http://api;
        }

        # Media previews in the admin (same volume as the public site).
        location /media/ {
            root /usr/share/nginx/html;
            expires 30d;
            add_header Cache-Control "public" always;
        }

        # Flutter entry points are not content-hashed and must always revalidate
        # (built with --pwa-strategy=none, see infra/scripts/deploy.sh).
        location = /index.html {
            add_header Cache-Control "no-cache, no-store, must-revalidate" always;
            expires off;
            # add_header in a location drops the server-level ones — repeat them.
            add_header X-Content-Type-Options "nosniff" always;
            add_header X-Frame-Options "DENY" always;
            add_header Referrer-Policy "no-referrer" always;
            add_header Strict-Transport-Security $site_hsts always;
        }
        location = /flutter_bootstrap.js    { add_header Cache-Control "no-cache, no-store, must-revalidate" always; expires off; }
        location = /flutter_service_worker.js { add_header Cache-Control "no-cache, no-store, must-revalidate" always; expires off; }
        location = /main.dart.js            { add_header Cache-Control "no-cache, must-revalidate" always; expires off; }
        location = /flutter.js              { add_header Cache-Control "no-cache, must-revalidate" always; expires off; }

        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot|wasm)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
        }
    }
}
