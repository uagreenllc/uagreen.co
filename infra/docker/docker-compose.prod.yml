# Explicit Compose project name: the Gospodar and TTApp stacks also live in an
# ".../infra/docker/" dir with services named postgres/api/nginx, so without
# this they would collide on the shared VPS.
name: uagreen_site

services:
  postgres:
    image: postgres:16-alpine
    container_name: uagreen_site_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-uagreen_site}
      POSTGRES_USER: ${POSTGRES_USER:-uagreen_site}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-uagreen_site}"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ../../backend
      dockerfile: src/UaGreen.Site.Api/Dockerfile
    container_name: uagreen_site_api
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: "http://+:8080"
      ConnectionStrings__Postgres: "Host=postgres;Port=5432;Database=${POSTGRES_DB:-uagreen_site};Username=${POSTGRES_USER:-uagreen_site};Password=${POSTGRES_PASSWORD}"
      # JWT — MUST match Gospodar's values byte-for-byte (Gospodar is the IdP).
      Jwt__SigningKey: ${JWT_SIGNING_KEY}
      Jwt__Issuer: ${JWT_ISSUER:-UaGreenApi}
      Jwt__Audience: ${JWT_AUDIENCE:-UaGreenApp}
      Gospodar__BaseUrl: ${GOSPODAR_BASE_URL}
      App__PublicBaseUrl: ${PUBLIC_BASE_URL}
      Cors__AllowedOrigins__0: ${ADMIN_BASE_URL}
      Smtp__Host: ${SMTP_HOST}
      Smtp__User: ${SMTP_USER}
      Smtp__Password: ${SMTP_PASSWORD}
      Smtp__From: ${SMTP_FROM}
      Notifications__OrderEmail: ${ORDER_EMAIL}
      LiqPay__PublicKey: ${LIQPAY_PUBLIC_KEY}
      LiqPay__PrivateKey: ${LIQPAY_PRIVATE_KEY}
      LiqPay__Sandbox: ${LIQPAY_SANDBOX:-true}
      # Media are plain files on two volumes: public (served by nginx as /media/)
      # and private (job-application CVs, streamed through the API).
      Storage__Root: /data/media
      Storage__PrivateRoot: /data/private
      # One-time Weblium import: set IMPORT_DIR=/import in .env, `up -d api`,
      # then unset it. The export is mounted read-only from ../../migration.
      Import__Dir: ${IMPORT_DIR:-}
    volumes:
      - media_data:/data/media
      - private_data:/data/private
      - ../../migration:/import:ro
    depends_on:
      postgres:
        condition: service_healthy

  # Nuxt 3 SSR (public site). Server-side fetches go straight to the API
  # container; the browser talks to /api on the same origin.
  web:
    build:
      context: ../../frontend
      dockerfile: Dockerfile
    container_name: uagreen_site_web
    restart: unless-stopped
    environment:
      NODE_ENV: production
      NITRO_PORT: "3000"
      NUXT_PUBLIC_SITE_URL: ${PUBLIC_BASE_URL}
      NUXT_API_BASE: "http://api:8080"
      NUXT_PUBLIC_API_BASE: "/api"
    depends_on:
      - api

  nginx:
    build:
      context: ../..
      dockerfile: infra/nginx/Dockerfile
    container_name: uagreen_site_nginx
    restart: unless-stopped
    ports:
      # Port 8083 blocked externally via UFW — only the shared OberigAI nginx
      # reaches it via the Docker host bridge (infra/nginx/vhost.conf.template).
      - "8083:80"
    volumes:
      - media_data:/usr/share/nginx/html/media:ro
    depends_on:
      - web
      - api

volumes:
  postgres_data:
  media_data:
  private_data:
